<html lang="ar" dir="rtl">
<head>

    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: #111827;
            --primary: #d4af37; /* ذهبي هندسي فاخر */
            --primary-light: #f3e5ab;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(212, 175, 55, 0.2);
            --whatsapp: #25d366;
            --facebook: #1877f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* Header / Navbar */
        header {
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
        }

        .brand-logo i {
            color: var(--primary);
            font-size: 1.6rem;
        }

        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
        }

        nav a.active, nav a:hover {
            color: var(--primary);
            background: rgba(212, 175, 55, 0.1);
        }

            color: var(--bg-deep);
