<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الهدى للإنشاءات والتشطيبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0b1329',
                        gold: '#d4af37'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <header class="bg-navy text-white p-4 sticky top-0 z-50 shadow-lg border-b-2 border-gold">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gold">شركة الهدى للإنشاءات والتشطيبات</h1>
            <nav class="space-x-4">
                <a href="#calculator" class="hover:text-gold transition">حاسبة التكلفة</a>
                <a href="#packages" class="hover:text-gold transition">باقات التشطيب</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4">
        <section id="calculator" class="bg-white p-6 rounded-2xl shadow-xl border border-gold mb-12">
            <h2 class="text-3xl font-bold mb-6 text-navy border-b-2 border-gold pb-2">حاسبة تكلفة التشطيب</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block font-bold mb-1">المساحة بالمتر المربع:</label>
                    <input type="number" id="area" placeholder="أدخل المساحة هنا" class="w-full border-2 border-gold rounded-lg p-3 focus:outline-none focus:border-navy">
                </div>

                <div>
                    <label class="block font-bold mb-1">اختر باقة التشطيب:</label>
                    <select id="package" class="w-full border-2 border-gold rounded-lg p-3 focus:outline-none focus:border-navy">
                        <option value="economy">الباقة الاقتصادية</option>
                        <option value="standard">الباقة القياسية</option>
                        <option value="luxury">الباقة الفاخرة</option>
                    </select>
                </div>

                <button class="bg-gold text-navy font-bold py-3 px-8 rounded-lg w-full hover:bg-yellow-500 transition shadow-lg" onclick="calculateCost()">احسب التكلفة</button>
            </div>

            <div class="mt-6 p-4 bg-navy rounded-lg text-white">
                <h3 class="text-xl font-bold">التكلفة التقديرية:</h3>
                <p id="totalCost" class="text-4xl font-bold text-gold">0 جنيه</p>
            </div>
            
            <a id="whatsappBtn" href="#" target="_blank" class="hidden mt-4 block w-full bg-green-500 text-white font-bold py-4 rounded-lg text-center hover:bg-green-600 transition shadow-lg">
                <i class="fab fa-whatsapp mr-2"></i> اطلب عرض سعر تفصيلي على واتساب
            </a>
        </section>
        
        <script>
            function calculateCost() {
                const area = parseFloat(document.getElementById('area').value);
                const pkg = document.getElementById('package').value;
                const pricePerMeter = { economy: 1500, standard: 2500, luxury: 4000 };
                const packageNames = { economy: 'الاقتصادية', standard: 'القياسية', luxury: 'الفاخرة' };
                
                if (isNaN(area) || area <= 0) {
                    alert('يرجى إدخال مساحة صحيحة.');
                    return;
                }
                
                const totalCost = area * pricePerMeter[pkg];
                document.getElementById('totalCost').innerText = totalCost.toLocaleString() + ' جنيه';
                
                const whatsappBtn = document.getElementById('whatsappBtn');
                const message = `أريد عرض سعر لتشطيب شقة مساحتها ${area} متر مربع بالباقة ${packageNames[pkg]}. التكلفة التقديرية هي ${totalCost.toLocaleString()} جنيه.`;
                whatsappBtn.href = `https://wa.me/201143054179?text=${encodeURIComponent(message)}`;
                whatsappBtn.classList.remove('hidden');
            }
        </script>
    </main>
</body>
</html>
